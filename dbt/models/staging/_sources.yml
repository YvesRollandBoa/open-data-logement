version: 2

sources:
  - name: raw
    description: Données brutes chargées par ingestion/load_raw.py (sans transformation).
    tables:
      - name: dvf_mutations
        description: >
          DVF géolocalisé (geo-dvf, Etalab / DGFiP). Une ligne par disposition × local × parcelle :
          une même mutation (vente) peut donc apparaître sur plusieurs lignes, avec la valeur
          foncière répétée sur chacune.
        loaded_at_field: _loaded_at
        columns:
          - name: id_mutation
            tests: [not_null]

      - name: dpe_logements
        description: >
          DPE des logements existants (ADEME, depuis juillet 2021), toutes colonnes en texte.
          Un même logement peut avoir plusieurs DPE (nouveau diagnostic, correction).
        loaded_at_field: _loaded_at
        columns:
          - name: numero_dpe
            tests:
              - not_null
              # Doublons techniques possibles si l'ADEME met à jour pendant la pagination
              # de l'API : simple alerte, ils sont retirés en staging.
              - unique:
                  config:
                    severity: warn

      - name: insee_comparateur
        description: >
          Base du comparateur de territoires INSEE (géographie au 1er janvier 2026), format long :
          une ligne par territoire × indicateur (TAB_MEASURE) × période (TIME_PERIOD).
          CONF_STATUS = 'C' signale une valeur couverte par le secret statistique.
        loaded_at_field: _loaded_at
